name = "visitor-log"
main = "src/index.js"
compatibility_date = "2026-09-01"

# TEST_MODE is never set here: tests pass --var TEST_MODE:1. The one-off SAMPLE seed used a temporary deploy with the var (docs/DEPLOY.md).

[[d1_databases]]
binding = "DB"
database_name = "visitor-log"
# Live D1 (created 2026-09-15 by `wrangler d1 create visitor-log`).
database_id = "81c7a857-cbd2-4eb6-85ea-a7b645381653"
migrations_dir = "migrations"

# Maintenance: auto sign-out at closing, retention deletes, expired sessions.
[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
