name = "visitor-log"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Local only tonight (wrangler dev --local). TEST_MODE is never set here: tests pass --var TEST_MODE:1.

[[d1_databases]]
binding = "DB"
database_name = "visitor-log"
# Placeholder: a real deploy replaces this with the id from `wrangler d1 create` (see docs/DEPLOY.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Maintenance: auto sign-out at closing, retention deletes, expired sessions.
[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = "../app/public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
